<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Endlos Jump'n'Run</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#6ec6ff;
    font-family:Arial;
}

canvas{
    display:block;
}

#hud{
    position:absolute;
    top:10px;
    left:10px;
    background:rgba(255,255,255,.9);
    padding:10px;
    border-radius:10px;
}

#gameover{
    position:absolute;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    font-size:80px;
    background:rgba(0,0,0,.8);
    color:white;
}
</style>
</head>
<body>

<div id="hud">
❤️ <span id="hp">5</span><br>
💰 <span id="gold">0</span><br>
⭐ <span id="xp">0</span><br>
🏆 <span id="lvl">1</span>
</div>

<div id="gameover">
GAME OVER
</div>

<canvas id="game"></canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

function resize(){
    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

const keys={};

addEventListener("keydown",e=>{
    keys[e.code]=true;
});

addEventListener("keyup",e=>{
    keys[e.code]=false;
});

const player={

    x:100,
    y:100,

    w:40,
    h:60,

    vx:0,
    vy:0,

    hp:5,
    xp:0,
    gold:0,
    level:1,

    grounded:false

};

let cameraX=0;
let gameOver=false;

let platforms=[];
let coins=[];
let enemies=[];

let lastGeneratedX=0;

function createForestChunk(startX){

    for(let i=0;i<12;i++){

        platforms.push({
            x:startX+i*180,
            y:500,
            w:120,
            h:20
        });

        coins.push({
            x:startX+i*180+60,
            y:450,
            taken:false
        });

    }

}

function createSkyChunk(startX){

    let height=250;

    for(let i=0;i<10;i++){

        height+=Math.random()*100-50;

        if(height<150) height=150;
        if(height>500) height=500;

        platforms.push({
            x:startX+i*220,
            y:height,
            w:120,
            h:20
        });

    }

}

function createEnemyChunk(startX){

    for(let i=0;i<10;i++){

        platforms.push({
            x:startX+i*180,
            y:500,
            w:120,
            h:20
        });

        enemies.push({

            x:startX+i*180+20,
            y:460,

            w:40,
            h:40,

            dir:Math.random()<0.5?-1:1,

            dead:false

        });

    }

}

function generateChunk(){

    const randomType=
    Math.floor(Math.random()*3);

    if(randomType===0){

        createForestChunk(
            lastGeneratedX
        );

    }

    else if(randomType===1){

        createSkyChunk(
            lastGeneratedX
        );

    }

    else{

        createEnemyChunk(
            lastGeneratedX
        );

    }

    lastGeneratedX+=2500;

}

for(let i=0;i<5;i++){

    generateChunk();

}

function rect(a,b){

    return(

        a.x < b.x+b.w &&
        a.x+a.w > b.x &&
        a.y < b.y+b.h &&
        a.y+a.h > b.y

    );

}

function update(){

    if(gameOver) return;

    if(
        player.x >
        lastGeneratedX-2500
    ){

        generateChunk();

    }

    platforms=
    platforms.filter(
    p=>p.x>player.x-5000
    );

    coins=
    coins.filter(
    c=>c.x>player.x-5000
    );

    enemies=
    enemies.filter(
    e=>e.x>player.x-5000
    );

    player.vx=0;

    if(
        keys["ArrowLeft"]||
        keys["KeyA"]
    ){
        player.vx=-5;
    }

    if(
        keys["ArrowRight"]||
        keys["KeyD"]
    ){
        player.vx=5;
    }

    if(
        (
            keys["Space"]||
            keys["ArrowUp"]||
            keys["KeyW"]
        ) &&
        player.grounded
    ){

        player.vy=-15;

        player.grounded=false;

    }

    player.vy+=0.8;

    player.x+=player.vx;
    player.y+=player.vy;

    player.grounded=false;

    for(const p of platforms){

        if(

            player.x+player.w>p.x &&
            player.x<p.x+p.w &&
            player.y+player.h>p.y &&
            player.y+player.h<p.y+25 &&
            player.vy>=0

        ){

            player.y=p.y-player.h;

            player.vy=0;

            player.grounded=true;

        }

    }

    for(const c of coins){

        if(c.taken) continue;

        const dx=
        player.x-c.x;

        const dy=
        player.y-c.y;

        const dist=
        Math.sqrt(
            dx*dx+
            dy*dy
        );

        if(dist<40){

            c.taken=true;

            player.gold++;

            player.xp+=5;

            if(player.xp>=100){

                player.xp=0;

                player.level++;

            }

        }

    }

    for(const e of enemies){

        if(e.dead) continue;

        e.x+=e.dir*2;

        if(
            Math.random()<0.01
        ){
            e.dir*=-1;
        }

        if(
            rect(player,e)
        ){

            if(player.vy>0){

                e.dead=true;

                player.vy=-10;

                player.gold+=3;

            }
            else{

                player.hp--;

                player.x-=100;

                if(
                    player.hp<=0
                ){

                    gameOver=true;

                    document
                    .getElementById(
                    "gameover"
                    )
                    .style.display=
                    "flex";

                }

            }

        }

    }

    cameraX=
    player.x-
    canvas.width/2;

    document
    .getElementById("hp")
    .textContent=
    player.hp;

    document
    .getElementById("gold")
    .textContent=
    player.gold;

    document
    .getElementById("xp")
    .textContent=
    player.xp;

    document
    .getElementById("lvl")
    .textContent=
    player.level;

}

function draw(){

    ctx.fillStyle=
    "#6ec6ff";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    for(const p of platforms){

        ctx.fillStyle=
        "#6b4f2a";

        ctx.fillRect(
            p.x-cameraX,
            p.y,
            p.w,
            p.h
        );

    }

    for(const c of coins){

        if(c.taken) continue;

        ctx.fillStyle=
        "gold";

        ctx.beginPath();

        ctx.arc(
            c.x-cameraX,
            c.y,
            10,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

    for(const e of enemies){

        if(e.dead) continue;

        ctx.fillStyle=
        "limegreen";

        ctx.fillRect(
            e.x-cameraX,
            e.y,
            e.w,
            e.h
        );

    }

    ctx.fillStyle=
    "crimson";

    ctx.fillRect(
        player.x-cameraX,
        player.y,
        player.w,
        player.h
    );

}

function loop(){

    requestAnimationFrame(
        loop
    );

    update();

    draw();

}

loop();

</script>
</body>
</html>
