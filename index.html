<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jump'n'Run FIX FINAL</title>

<style>
body{margin:0;overflow:hidden;background:#6ec6ff;font-family:Arial}
canvas{display:block}

#hud{
position:absolute;left:10px;top:10px;
background:rgba(255,255,255,.85);
padding:10px;border-radius:8px;
font-weight:bold;
}

#panel{
position:absolute;right:10px;top:10px;
background:rgba(255,255,255,.9);
padding:10px;border-radius:8px;
}
button{margin:3px}
</style>
</head>

<body>

<div id="hud">
❤️ <span id="hp">5</span>
⭐ <span id="xp">0</span>
💰 <span id="gold">0</span>
🏁 CP <span id="cp">0</span>
</div>

<div id="panel">
<button id="red">Rot</button>
<button id="blue">Blau</button>
<button id="green">Grün</button>
<button id="shop">+1 Leben (10 Gold)</button>
</div>

<canvas id="c"></canvas>

<script>
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");

function resize(){
canvas.width=innerWidth;
canvas.height=innerHeight;
}
resize();
addEventListener("resize",resize);

/* 🎮 INPUT */
const keys={};
onkeydown=e=>keys[e.code]=true;
onkeyup=e=>keys[e.code]=false;

/* 👤 PLAYER */
const p={
x:100,y:100,w:40,h:60,
vx:0,vy:0,
color:"crimson",
hp:5,
xp:0,
gold:0,
ground:false
};

/* 🌍 WORLD */
const plats=[];
const coins=[];

/* 🏁 CHECKPOINT (ONLY ONE - FIXED) */
let checkpoint = {x:100,y:200};

let cam=0;
let gameOver=false;

let worldX=0;

/* 🌱 GENERATOR */
function generate(x){
const y = 350 + Math.random()*250;

plats.push({x,y,w:150,h:20});

/* coins */
if(Math.random()<0.6){
coins.push({x:x+60,y:y-40,taken:false});
}

/* checkpoint occasionally */
if(Math.random()<0.12){
checkpoint = {x:x+60,y:y-60};
}
}

/* initial world */
for(let i=0;i<25;i++){
generate(i*160);
worldX+=160;
}

/* collision */
function rect(a,b){
return a.x<b.x+b.w &&
a.x+a.w>b.x &&
a.y<b.y+b.h &&
a.y+a.h>b.y;
}

/* 🧠 RESPAWN (IMPORTANT FIX) */
function respawn(){
p.x = checkpoint.x;
p.y = checkpoint.y;
p.vx = 0;
p.vy = 0;
}

/* RESET GAME (only on GAME OVER) */
function resetGame(){
p.x=100;
p.y=100;
p.vx=0;
p.vy=0;

p.hp=5;
p.xp=0;
p.gold=0;

checkpoint = {x:100,y:200};

gameOver=false;

plats.length=0;
coins.length=0;
worldX=0;

for(let i=0;i<25;i++){
generate(i*160);
worldX+=160;
}
}

/* BUTTONS */
document.getElementById("red").onclick=()=>p.color="crimson";
document.getElementById("blue").onclick=()=>p.color="royalblue";
document.getElementById("green").onclick=()=>p.color="seagreen";

document.getElementById("shop").onclick=()=>{
if(p.gold>=10){
p.gold-=10;
p.hp++;
}
};

/* UPDATE */
function update(){
if(gameOver) return;

p.vx=0;

if(keys["ArrowLeft"]||keys["KeyA"]) p.vx=-5;
if(keys["ArrowRight"]||keys["KeyD"]) p.vx=5;

if((keys["Space"]||keys["KeyW"]) && p.ground){
p.vy=-14;
p.ground=false;
}

p.vy+=0.6;
p.x+=p.vx;
p.y+=p.vy;

p.ground=false;

/* platforms */
for(const pl of plats){
if(p.x+p.w>pl.x && p.x<pl.x+pl.w &&
p.y+p.h>pl.y && p.y+p.h<pl.y+25 && p.vy>=0){

p.y=pl.y-p.h;
p.vy=0;
p.ground=true;
}
}

/* coins */
for(const c of coins){
if(c.taken) continue;

if(Math.hypot(p.x-c.x,p.y-c.y)<30){
c.taken=true;
p.gold++;
p.xp+=5;
}
}

/* checkpoint update */
if(Math.hypot(p.x-checkpoint.x,p.y-checkpoint.y)<50){
checkpoint = checkpoint;
}

/* generate endless world */
while(worldX < p.x+1200){
generate(worldX);
worldX+=160;
}

/* cleanup */
for(let i=plats.length-1;i>=0;i--){
if(plats[i].x < p.x-1200){
plats.splice(i,1);
}
}

/* ☠️ FALL DAMAGE */
if(p.y > canvas.height+200){
p.hp--;

if(p.hp<=0){
gameOver=true;
return;
}

respawn();
}

/* camera */
cam=p.x-canvas.width/2;

/* HUD */
document.getElementById("hp").textContent=p.hp;
document.getElementById("xp").textContent=p.xp;
document.getElementById("gold").textContent=p.gold;
document.getElementById("cp").textContent=Math.floor(checkpoint.x/800);
}

/* DRAW */
function draw(){

ctx.fillStyle="#6ec6ff";
ctx.fillRect(0,0,canvas.width,canvas.height);

/* platforms */
for(const pl of plats){
ctx.fillStyle="#6b4f1d";
ctx.fillRect(pl.x-cam,pl.y,pl.w,pl.h);
}

/* coins */
for(const c of coins){
if(c.taken) continue;
ctx.fillStyle="gold";
ctx.beginPath();
ctx.arc(c.x-cam,c.y,10,0,Math.PI*2);
ctx.fill();
}

/* checkpoint */
ctx.fillStyle="red";
ctx.fillRect(checkpoint.x-cam,checkpoint.y,20,60);

/* player */
ctx.fillStyle=p.color;
ctx.fillRect(p.x-cam,p.y,p.w,p.h);

/* GAME OVER */
if(gameOver){
ctx.fillStyle="rgba(0,0,0,0.85)";
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="white";
ctx.font="70px Arial";
ctx.fillText("GAME OVER",canvas.width/2-200,canvas.height/2);

/* restart */
ctx.fillStyle="#00ff99";
ctx.fillRect(canvas.width/2-100,canvas.height/2+60,200,60);

ctx.fillStyle="black";
ctx.font="30px Arial";
ctx.fillText("RESTART",canvas.width/2-60,canvas.height/2+100);
}
}

/* restart click */
canvas.addEventListener("click",e=>{
if(!gameOver) return;

const r=canvas.getBoundingClientRect();
const mx=e.clientX-r.left;
const my=e.clientY-r.top;

if(mx>canvas.width/2-100 &&
mx<canvas.width/2+100 &&
my>canvas.height/2+60 &&
my<canvas.height/2+120){
resetGame();
}
});

/* LOOP */
function loop(){
requestAnimationFrame(loop);
update();
draw();
}
loop();

</script>

</body>
</html>
