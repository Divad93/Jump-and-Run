<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Big HTML Game</title>

<style>
    body {
        margin: 0;
        background: #111;
        overflow: hidden;
        font-family: Arial;
        color: white;
    }

    canvas {
        display: block;
        margin: auto;
        background: #222;
    }

    #ui {
        position: fixed;
        top: 10px;
        left: 10px;
        font-size: 20px;
    }
</style>
</head>

<body>

<div id="ui">Punkte: 0</div>
<canvas id="game" width="800" height="500"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let player = {
    x: 400,
    y: 450,
    size: 20,
    speed: 6
};

let keys = {};
let enemies = [];
let score = 0;
let gameOver = false;

// Tastatur
document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

// Gegner erstellen
function spawnEnemy() {
    enemies.push({
        x: Math.random() * 780,
        y: -20,
        size: 20 + Math.random() * 30,
        speed: 2 + Math.random() * 4
    });
}

// Kollision
function collision(a, b) {
    return (
        a.x < b.x + b.size &&
        a.x + a.size > b.x &&
        a.y < b.y + b.size &&
        a.y + a.size > b.y
    );
}

// Update
function update() {
    if (gameOver) return;

    // Bewegung
    if (keys["ArrowLeft"]) player.x -= player.speed;
    if (keys["ArrowRight"]) player.x += player.speed;
    if (keys["ArrowUp"]) player.y -= player.speed;
    if (keys["ArrowDown"]) player.y += player.speed;

    // Grenzen
    player.x = Math.max(0, Math.min(canvas.width - player.size, player.x));
    player.y = Math.max(0, Math.min(canvas.height - player.size, player.y));

    // Gegner bewegen
    enemies.forEach(e => {
        e.y += e.speed;

        if (collision(player, e)) {
            gameOver = true;
        }

        if (e.y > canvas.height) {
            score++;
            document.getElementById("ui").innerText = "Punkte: " + score;
        }
    });

    enemies = enemies.filter(e => e.y < canvas.height);
}

// Zeichnen
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Spieler
    ctx.fillStyle = "lime";
    ctx.fillRect(player.x, player.y, player.size, player.size);

    // Gegner
    ctx.fillStyle = "red";
    enemies.forEach(e => {
        ctx.fillRect(e.x, e.y, e.size, e.size);
    });

    // Game Over
    if (gameOver) {
        ctx.fillStyle = "white";
        ctx.font = "50px Arial";
        ctx.fillText("GAME OVER", 250, 250);
    }
}

// Loop
function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

// Gegner regelmäßig spawnen
setInterval(spawnEnemy, 500);

// Start
loop();
</script>

</body>
</html>
