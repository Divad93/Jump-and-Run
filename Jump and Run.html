<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2D Jump & Run</title>
<style>
    body {
        margin: 0;
        overflow: hidden;
        background: #87ceeb;
        font-family: Arial, sans-serif;
    }

    canvas {
        display: block;
        margin: 0 auto;
        background: linear-gradient(#87ceeb, #dff6ff);
    }

    #ui {
        position: absolute;
        top: 10px;
        left: 10px;
        color: white;
        font-size: 24px;
        font-weight: bold;
        text-shadow: 2px 2px 4px black;
    }
</style>
</head>
<body>

<div id="ui">Münzen: 0</div>
<canvas id="game" width="1000" height="600"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const keys = {};

document.addEventListener("keydown", e => {
    keys[e.code] = true;
});

document.addEventListener("keyup", e => {
    keys[e.code] = false;
});

const GRAVITY = 0.7;

const player = {
    x: 100,
    y: 300,
    w: 40,
    h: 60,
    vx: 0,
    vy: 0,
    speed: 5,
    jumpPower: -14,
    grounded: false,
    color: "#ff4444"
};

const platforms = [
    {x:0, y:550, w:3000, h:50},
    {x:300, y:450, w:200, h:20},
    {x:600, y:380, w:200, h:20},
    {x:900, y:320, w:180, h:20},
    {x:1200, y:420, w:250, h:20},
    {x:1600, y:300, w:220, h:20},
    {x:1950, y:240, w:220, h:20},
    {x:2350, y:180, w:220, h:20}
];

const coins = [
    {x:350,y:400,collected:false},
    {x:650,y:330,collected:false},
    {x:980,y:270,collected:false},
    {x:1270,y:370,collected:false},
    {x:1680,y:250,collected:false},
    {x:2030,y:190,collected:false},
    {x:2420,y:130,collected:false}
];

const goal = {
    x: 2700,
    y: 450,
    w: 40,
    h: 100
};

let score = 0;
let cameraX = 0;
let won = false;

function rectCollision(a, b) {
    return (
        a.x < b.x + b.w &&
        a.x + a.w > b.x &&
        a.y < b.y + b.h &&
        a.y + a.h > b.y
    );
}

function update() {

    if (won) return;

    player.vx = 0;

    if (keys["ArrowLeft"] || keys["KeyA"]) {
        player.vx = -player.speed;
    }

    if (keys["ArrowRight"] || keys["KeyD"]) {
        player.vx = player.speed;
    }

    if ((keys["Space"] || keys["ArrowUp"] || keys["KeyW"]) && player.grounded) {
        player.vy = player.jumpPower;
        player.grounded = false;
    }

    player.vy += GRAVITY;

    player.x += player.vx;

    player.y += player.vy;

    player.grounded = false;

    for (const p of platforms) {

        if (
            player.x < p.x + p.w &&
            player.x + player.w > p.x &&
            player.y + player.h > p.y &&
            player.y + player.h < p.y + p.h + 20 &&
            player.vy >= 0
        ) {
            player.y = p.y - player.h;
            player.vy = 0;
            player.grounded = true;
        }
    }

    for (const coin of coins) {

        if (coin.collected) continue;

        const dx = (player.x + player.w/2) - coin.x;
        const dy = (player.y + player.h/2) - coin.y;

        if (Math.sqrt(dx*dx + dy*dy) < 35) {
            coin.collected = true;
            score++;
            document.getElementById("ui").textContent =
                "Münzen: " + score;
        }
    }

    if (rectCollision(player, goal)) {
        won = true;
    }

    if (player.y > 1000) {
        player.x = 100;
        player.y = 300;
        player.vx = 0;
        player.vy = 0;
    }

    cameraX = player.x - canvas.width / 3;
}

function draw() {

    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.save();
    ctx.translate(-cameraX,0);

    // Hintergrundberge
    for(let i=0;i<10;i++){
        ctx.fillStyle="#6dbb63";
        ctx.beginPath();
        ctx.moveTo(i*500,550);
        ctx.lineTo(i*500+150,250);
        ctx.lineTo(i*500+300,550);
        ctx.fill();
    }

    // Plattformen
    ctx.fillStyle = "#654321";

    for (const p of platforms) {
        ctx.fillRect(p.x,p.y,p.w,p.h);
    }

    // Münzen
    for (const coin of coins) {

        if (coin.collected) continue;

        ctx.fillStyle = "gold";
        ctx.beginPath();
        ctx.arc(coin.x, coin.y, 12, 0, Math.PI*2);
        ctx.fill();
    }

    // Ziel
    ctx.fillStyle = "white";
    ctx.fillRect(goal.x, goal.y, goal.w, goal.h);

    ctx.fillStyle = "red";
    ctx.fillRect(goal.x, goal.y, goal.w, 20);

    // Spieler
    ctx.fillStyle = player.color;
    ctx.fillRect(player.x, player.y, player.w, player.h);

    ctx.restore();

    if (won) {
        ctx.fillStyle = "rgba(0,0,0,0.7)";
        ctx.fillRect(0,0,canvas.width,canvas.height);

        ctx.fillStyle = "white";
        ctx.font = "60px Arial";
        ctx.textAlign = "center";
        ctx.fillText("GEWONNEN!", canvas.width/2, 250);

        ctx.font = "32px Arial";
        ctx.fillText(
            "Gesammelte Münzen: " + score,
            canvas.width/2,
            320
        );
    }
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
